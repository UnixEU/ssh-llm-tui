# ssh-llm-tui talks to Docker Model Runner over HTTP only. Model settings
# (context size, GPU/CPU placement) use the same API as `docker model configure`.
# Do not add a docker.sock mount and do not install the docker CLI in the image.
# DMR itself is already running on the host (container docker-model-runner).
# This file does not start a second model runner.

# Fixed names, so the container, network and volumes do not depend on the
# checkout directory name.
name: ssh-llm-tui

services:
  ssh-llm-tui:
    build: .
    image: ssh-llm-tui:1.4.1
    container_name: ssh-llm-tui
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      # Per-user uploads, up to UPLOAD_MAX_TOTAL_BYTES (256 MiB) per user.
      # tmpfs lives in host RAM and only uses what is stored. Set
      # UPLOADS_TMPFS_SIZE in .env (see .env.example) for several users or
      # larger trees. uid matches the image user.
      - /uploads:size=${UPLOADS_TMPFS_SIZE:-256m},uid=65532,gid=65532,mode=0755
      # Per-user downloads (edited files, changes.patch, tar.gz archives),
      # up to DOWNLOAD_MAX_TOTAL_BYTES (256 MiB) per user. Wiped with the
      # user's last TUI session, like uploads. DOWNLOADS_TMPFS_SIZE in .env.
      - /downloads:size=${DOWNLOADS_TMPFS_SIZE:-256m},uid=65532,gid=65532,mode=0755
    ports:
      - "2222:2222"
    # host-gateway is the host bridge address (172.17.0.1 on a typical
    # docker0), where DMR commonly publishes port 12434. The name is not
    # built in on Docker Engine, so the extra host entry is required.
    # model-runner.docker.internal is the name from the Docker docs. It is
    # mapped as well so either base URL works.
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "model-runner.docker.internal:host-gateway"
    # Stats only. utility does not reserve the GPU for inference; DMR keeps that.
    # Requires the NVIDIA container toolkit on the host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [utility]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility
      GPU_STATS: auto
      GPU_POLL_INTERVAL: 2s
      # Host CPU usage and RAM in front of the GPU columns.
      SYS_STATS: "on"
      GPU_TEMP_WARN: "40"
      GPU_TEMP_HOT: "60"
      GPU_TEMP_CRIT: "70"
      GPU_POWER_WARN: "25"
      GPU_POWER_HOT: "100"
      GPU_POWER_CRIT: "200"
      GPU_MEM_WARN: "40"
      GPU_MEM_HOT: "60"
      GPU_MEM_CRIT: "90"
      MARKDOWN: "on"
      # Context gauge in the chat title and the ctrl+x panel.
      CONTEXT_USAGE: "on"
      CONTEXT_WARN_PCT: "80"
      COMPRESS_KEEP_TURNS: "2"
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10M}
      UPLOAD_MAX_FILES: "1000"
      UPLOAD_MAX_TOTAL_BYTES: ${UPLOAD_MAX_TOTAL_BYTES:-256M}
      UPLOAD_IGNORE: .git,node_modules,.venv,__pycache__,.DS_Store
      UPLOAD_AUTO_INCLUDE: "20"
      CONTEXT_TOKEN_BUDGET: "8192"
      # Model-proposed file changes, reviewed with ctrl+e (see README).
      # Raise CONTEXT_TOKEN_BUDGET and the model context for larger edits.
      EDIT_MODE: "on"
      EDIT_PROTOCOL: blocks
      EDIT_MAX_FILES: "20"
      EDIT_ALLOW_NEW: "true"
      EDIT_ALLOW_DELETE: "false"
      DOWNLOAD_DIR: /downloads
      DOWNLOAD_MAX_TOTAL_BYTES: ${DOWNLOAD_MAX_TOTAL_BYTES:-256M}
      DOWNLOAD_ARCHIVE: tar.gz
      # Name and port clients use to reach this server. Only used to print
      # exact scp/sftp download commands in the TUI.
      # PUBLIC_HOST: llm.example.lan
      # PUBLIC_PORT: "2222"
      IMAGE_MAX_PX: "1536"
      IMAGE_MAX_BYTES: "2M"
      # VISION_MODELS: "ai/*vl*"
      # NON_VISION_MODELS: "ai/gpt-oss*"
      # Banner is copied into the image at build time from banner.txt.
      # Edit that file and rebuild to customise the art.
      WELCOME_BANNER_FILE: /usr/share/ssh-llm-tui/banner.txt
      # Default. DMR is published on 127.0.0.1 and 172.17.0.1 only.
      # 127.0.0.1 inside this container is not the host.
      DMR_BASE_URL: http://host.docker.internal:12434
      # Direct alternative, if host-gateway is not usable:
      # DMR_BASE_URL: http://172.17.0.1:12434
      DMR_REQUEST_TIMEOUT: 60s
      DMR_WARM_TIMEOUT: 10m
      # Memory check, context size and GPU/CPU placement (see README).
      FIT_CHECK: "on"
      FIT_MARGIN_MIB: "1024"
      FIT_MARGIN_PCT: "5"
      CONTEXT_CHOICES: 8k,16k,32k,64k,128k
      DEFAULT_CONTEXT: auto
      CONTEXT_SELECT: "on"
      TARGET_SELECT: "on"
      ALLOW_CPU: "on"
      # KV_CACHE_TYPE: q8_0
      # CPU_THREADS: "16"
      # Read-only view of the DMR model store, used to read GGUF headers.
      # Remove this line and the dmr-models mount below if your DMR does not
      # keep models in a Docker volume (for example Docker Desktop).
      MODEL_STORE_PATH: /dmr-models
      # p on the model list: Docker Hub search and background pulls into DMR,
      # open to every user. The free space of the model disk is read from
      # MODEL_STORE_PATH; a pull that does not fit is refused.
      MODEL_PULL: ${MODEL_PULL:-on}
      MODEL_PULL_CONCURRENCY: ${MODEL_PULL_CONCURRENCY:-1}
      MODEL_PULL_MIN_FREE: ${MODEL_PULL_MIN_FREE:-2G}
      FIT_USAGE_PATH: /data/fit/usage.json
      AUTH_MODE: open
      # Switch to key auth by setting AUTH_MODE=keys and mounting a file:
      # AUTH_MODE: keys
      # AUTHORIZED_KEYS_PATH: /keys/authorized_keys
      CONFIG_PATH: /config/config.yaml
      HOST_KEY_PATH: /data/hostkeys/ssh_host_ed25519_key
      SSH_HOST: 0.0.0.0
      SSH_PORT: "2222"
      # These override the same fields in the YAML file.
      WELCOME_TITLE: ssh-llm-tui
      # Leave WELCOME_MESSAGE unset when banner.txt is in use. The welcome
      # screen is the banner alone while that file fits the terminal.
      # WELCOME_MESSAGE: |
      #   Welcome. This session chats with local models served by
      #   Docker Model Runner.
      # MODELS_EMPTY: |
      #   No models yet. Pull one on the host, then press r.
    volumes:
      - ./config.example.yaml:/config/config.yaml:ro
      # Optional: use a custom banner without rebuilding the image.
      # - ./banner.txt:/usr/share/ssh-llm-tui/banner.txt:ro
      - hostkeys:/data/hostkeys
      # Measured GPU usage per model (fallback for the memory check).
      - fitdata:/data/fit
      # Optional: DMR's model store, read-only. Only GGUF headers are read.
      # Needs the external volume below; see README "Memory check".
      - dmr-models:/dmr-models:ro
      # - ./authorized_keys:/keys/authorized_keys:ro
    networks:
      - ssh-llm-tui-net
    restart: unless-stopped

networks:
  ssh-llm-tui-net:
    name: ssh-llm-tui-net

volumes:
  hostkeys:
    name: ssh-llm-tui-hostkeys
  fitdata:
    name: ssh-llm-tui-fitdata
  # Created by Docker Model Runner on Docker Engine. Check the name with
  # `docker volume ls`. Remove this entry together with the mount above if
  # it does not exist on your host.
  dmr-models:
    external: true
    name: docker-model-runner-models
