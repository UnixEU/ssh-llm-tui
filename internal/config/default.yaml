# ssh-llm-tui screen text.
# Environment variables override these fields. See the README for the names.
# Operational settings (listen address, DMR URL, auth) live here too and are
# also overridable by environment variables. Env wins over this file.

server:
  host: 0.0.0.0
  port: 2222
  host_key_path: /data/hostkeys/ssh_host_ed25519_key
  # open: anyone who can reach the port gets a session (LAN default).
  # keys: only public keys listed in authorized_keys_path are accepted.
  auth_mode: open
  authorized_keys_path: ""

dmr:
  # From a container on Docker Engine, host-gateway is the host's bridge
  # address (172.17.0.1 on a typical docker0). Compose must map the name:
  #   extra_hosts: ["host.docker.internal:host-gateway"]
  # DMR commonly publishes 12434 on 127.0.0.1 and on the docker0 gateway only.
  # 127.0.0.1 inside the container is the container itself, not the host.
  # Direct alternative, if the bridge IP is reachable: http://172.17.0.1:12434
  base_url: http://host.docker.internal:12434
  request_timeout: 60s
  warm_timeout: 10m

welcome:
  title: ssh-llm-tui
  # Optional ASCII art. Read again every time the welcome screen is shown.
  # The image includes banner.txt at /usr/share/ssh-llm-tui/banner.txt and
  # sets WELCOME_BANNER_FILE to that path. Leave this empty to use that
  # default. Edit banner.txt and rebuild to customise the art.
  banner_file: ""
  message: |
    Welcome. This session chats with local models on Docker Model Runner.

    Upload a file or a whole folder from another terminal, then pick
    what goes into the prompt with ctrl+f:

      scp -P 2222 notes.txt user@host:uploads/
      scp -P 2222 -r folder user@host:uploads/

    The model can propose changes to uploaded text files. Review them
    with ctrl+e, export them, then fetch them from downloads/:

      scp -P 2222 -r user@host:downloads/files .

    FileZilla and WinSCP can use the same port (SFTP).
  hint: Press any key to continue. ctrl+q exits.

models:
  title: Choose a model
  empty: |
    No models are pulled into Docker Model Runner yet.

    The runner answered, and its model list is empty. Pull a model on
    the Docker host, for example:

      docker model pull ai/smollm2

    Then press r to refresh this list.
  hint: Enter selects a model. r refreshes the list.
  loading: Fetching models from Docker Model Runner…

loading:
  title: Loading model
  message: Warming {model} into GPU memory. Every SSH session shares this GPU.

chat:
  title: Chat
  placeholder: Message the model, then press enter
  system_prompt: You are a helpful assistant running locally via Docker Model Runner. Answer concisely.
  you_label: you
  # Ask the backend for token counts for the context gauge (on/off).
  context_usage: "on"
  # Gauge turns orange at this share of the context; ctrl+x offers compress.
  context_warn_pct: 80
  # Exchanges kept verbatim when ctrl+x compresses the history.
  compress_keep_turns: 2

footer:
  change_model: ctrl+n change model
  exit: ctrl+q / esc exit
  scroll: pgup/pgdn scroll

fit:
  # Memory check before a model loads.
  #   on:     a model that does not fit is refused; an unknown need asks first.
  #   strict: an unknown need is refused too.
  #   off:    no check (the pickers below still work).
  check: "on"
  # Headroom kept free on every GPU (and in RAM for the CPU target):
  # max(margin_mib, margin_pct % of the device's total memory).
  margin_mib: 1024
  margin_pct: 5
  # Context sizes offered when a model is chosen. Sizes above the model's
  # trained context are hidden.
  contexts: 8k,16k,32k,64k,128k
  # Preselected context: auto (the largest that fits) or a size such as 16k.
  default_context: auto
  context_select: "on"
  # Offer Auto (all GPUs), each single GPU and, with allow_cpu, the CPU.
  target_select: "on"
  allow_cpu: "on"
  # Read-only mount of the Docker Model Runner model store. GGUF headers
  # are read from it to size models exactly. Empty disables header reads.
  model_store_path: ""
  # Optional llama.cpp KV cache type: f16 (default), q8_0, q4_0, ...
  kv_cache_type: ""
  # llama.cpp threads for the CPU target. 0 keeps the llama.cpp default.
  cpu_threads: 0
  # GPU memory measured after each load, used when a header is unreadable.
  # off keeps it in memory only.
  usage_path: /data/fit/usage.json

hub:
  # p on the model list searches Docker Hub and pulls models into DMR in
  # the background, open to every user. off hides it.
  pull: "on"
  url: https://hub.docker.com
  namespace: ai
  # Hub listings are cached; anonymous clients are rate-limited.
  cache_ttl: 30m
  # off hides vLLM repos and MLX/safetensors tags, which the llama.cpp
  # backend cannot run.
  all_tags: "off"
  # Pulls running at once (1 or 2). Others wait in the queue.
  pull_concurrency: 1
  # Bytes kept free on the model disk after the download and every queued
  # one. A pull that does not fit is refused. 2 GiB.
  pull_min_free: 2147483648
  # Where free space is read. Empty uses fit.model_store_path.
  models_dir: ""

edit:
  # Changes proposed by the model to uploaded text files. Nothing is used
  # until it is accepted on the review screen (ctrl+e); uploads stay as
  # they were. off hides edit mode.
  mode: "on"
  # blocks: SEARCH/REPLACE, WHOLE and DELETE blocks in the reply.
  protocol: blocks
  # Files one reply may change.
  max_files: 20
  allow_new: "on"
  allow_delete: "off"

downloads:
  # Edited files, changes.patch and tar.gz archives, read-only for clients
  # (get and delete). Removed with the user's last TUI session.
  dir: /downloads
  max_total_bytes: 268435456
  archive: tar.gz
  # Host and port shown in the download commands. Empty host prints "host";
  # port 0 uses the SSH port.
  public_host: ""
  public_port: 0
